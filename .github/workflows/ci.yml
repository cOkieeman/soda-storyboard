name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync python scripts/check_release_version.py
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - name: Install CJK fonts for lettering tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: uv run --no-sync pytest

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
